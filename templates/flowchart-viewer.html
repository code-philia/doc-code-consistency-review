<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流程图查看</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .controls {
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
            position: relative;
        }
        .control-btn {
            background: #409eff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .control-btn:hover {
            background: #337ecc;
        }
        .zoom-info {
            color: #666;
            font-size: 14px;
            margin-left: 10px;
        }
        .flowchart-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            width: 95vw;
            height: 80vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .flowchart-container:active {
            cursor: grabbing;
        }
        .flowchart-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
            transform-origin: center center;
        }
        .flowchart-wrapper svg {
            max-width: none;
            max-height: none;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="control-btn" onclick="zoomIn()">放大 +</button>
        <button class="control-btn" onclick="zoomOut()">缩小 -</button>
        <button class="control-btn" onclick="resetZoom()">重置</button>
        <button class="control-btn" onclick="fitToScreen()">适应屏幕</button>
        <button class="control-btn" onclick="downloadSVG()" style="background: #67c23a;">下载 SVG</button>
        <button class="control-btn" onclick="downloadPNG()" style="background: #e6a23c;">下载 PNG</button>
        <span class="zoom-info">缩放: <span id="zoom-level">100%</span></span>
    </div>
    <div class="flowchart-container" id="container">
        <div class="flowchart-wrapper" id="wrapper">
            {{SVG_CONTENT}}
        </div>
    </div>

    <script>
        let currentZoom = 1;
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0;
        
        const container = document.getElementById('container');
        const wrapper = document.getElementById('wrapper');
        const zoomLevelSpan = document.getElementById('zoom-level');
        const svg = wrapper.querySelector('svg');
        
        // 获取SVG原始尺寸
        const svgRect = svg.getBoundingClientRect();
        const originalWidth = svgRect.width;
        const originalHeight = svgRect.height;
        
        function updateTransform() {
            wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
            zoomLevelSpan.textContent = Math.round(currentZoom * 100) + '%';
        }
        
        function zoomIn() {
            currentZoom = Math.min(currentZoom * 1.2, 5);
            updateTransform();
        }
        
        function zoomOut() {
            currentZoom = Math.max(currentZoom / 1.2, 0.1);
            updateTransform();
        }
        
        function resetZoom() {
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }
        
        function fitToScreen() {
            const containerRect = container.getBoundingClientRect();
            const scaleX = (containerRect.width - 60) / originalWidth;
            const scaleY = (containerRect.height - 60) / originalHeight;
            currentZoom = Math.min(scaleX, scaleY, 1);
            translateX = 0;
            translateY = 0;
            updateTransform();
        }
        
        // 下载SVG功能
        function downloadSVG() {
            // 创建一个临时的SVG副本
            const svgClone = svg.cloneNode(true);
            
            // 获取SVG的原始尺寸
            const svgBBox = svg.getBBox();
            const svgWidth = svgBBox.width || originalWidth;
            const svgHeight = svgBBox.height || originalHeight;
            
            // 设置SVG的viewBox和尺寸
            svgClone.setAttribute('width', svgWidth);
            svgClone.setAttribute('height', svgHeight);
            svgClone.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
            
            // 添加白色背景
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('width', '100%');
            rect.setAttribute('height', '100%');
            rect.setAttribute('fill', 'white');
            svgClone.insertBefore(rect, svgClone.firstChild);
            
            // 序列化SVG
            const svgData = new XMLSerializer().serializeToString(svgClone);
            
            // 创建SVG Blob并下载
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            
            // 创建下载链接
            const a = document.createElement('a');
            a.href = url;
            a.download = `flowchart_${new Date().getTime()}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // 清理URL
            URL.revokeObjectURL(url);
        }
        
        // 下载PNG功能
        function downloadPNG() {
            const svgClone = svg.cloneNode(true);

            // 获取SVG尺寸
            const svgBBox = svg.getBBox();
            const svgWidth = svgBBox.width || originalWidth;
            const svgHeight = svgBBox.height || originalHeight;

            svgClone.setAttribute('width', svgWidth);
            svgClone.setAttribute('height', svgHeight);
            svgClone.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);

            // 添加白色背景
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('width', '100%');
            rect.setAttribute('height', '100%');
            rect.setAttribute('fill', 'white');
            svgClone.insertBefore(rect, svgClone.firstChild);

            const svgData = new XMLSerializer().serializeToString(svgClone);
            // 使用 data URI 而非 blob URL，避免 Canvas 跨域污染
            const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);

            const scale = 2;  // 2倍分辨率
            const canvas = document.createElement('canvas');
            canvas.width = svgWidth * scale;
            canvas.height = svgHeight * scale;
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, svgWidth, svgHeight);

                canvas.toBlob(function(blob) {
                    const pngUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = pngUrl;
                    a.download = `flowchart_${new Date().getTime()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(pngUrl);
                }, 'image/png');
            };
            img.src = dataUrl;
        }

        // 鼠标滚轮缩放
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const oldZoom = currentZoom;
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            currentZoom = Math.max(0.1, Math.min(5, currentZoom * zoomFactor));
            
            // 以鼠标位置为中心缩放
            const zoomRatio = currentZoom / oldZoom;
            translateX = mouseX - (mouseX - translateX) * zoomRatio;
            translateY = mouseY - (mouseY - translateY) * zoomRatio;
            
            updateTransform();
        });
        
        // 拖拽功能
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            container.style.cursor = 'grabbing';
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'grab';
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case '=':
                    case '+':
                        e.preventDefault();
                        zoomIn();
                        break;
                    case '-':
                        e.preventDefault();
                        zoomOut();
                        break;
                    case '0':
                        e.preventDefault();
                        resetZoom();
                        break;
                }
            }
        });
        
        // 初始化 - 适应屏幕
        setTimeout(() => {
            fitToScreen();
        }, 100);
    </script>
</body>
</html>
